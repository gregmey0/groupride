name: Application iPhone (TestFlight)

# Sans les secrets Apple : compilation de contrôle pour le simulateur (non signée).
# Avec les secrets APPSTORE_KEY_ID, APPSTORE_ISSUER_ID, APPSTORE_KEY_P8 et APPLE_TEAM_ID :
# archive signée (signature gérée par Apple) et envoi direct vers TestFlight.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      HAS_KEYS: ${{ secrets.APPSTORE_KEY_P8 != '' && secrets.APPSTORE_KEY_ID != '' && secrets.APPSTORE_ISSUER_ID != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Préparer le projet (web + iOS)
        shell: bash
        run: |
          set -o pipefail
          { xcodebuild -version && npm ci && python3 build.py && npx cap sync ios; } 2>&1 | tee build.log

      - name: Compilation de contrôle (simulateur, sans signature)
        if: env.HAS_KEYS != 'true'
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee -a build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)|\*\*" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Archive signée et envoi vers TestFlight
        if: env.HAS_KEYS == 'true'
        shell: bash
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          KEY="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"; printf '%s\n' "$KEY_P8" > "$KEY"
          VER=$(node -p "require('./package.json').version")
          BUILD=$(( 100 + ${{ github.run_number }} ))
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID")
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/GroupRide.xcarchive" \
            "${AUTH[@]}" DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VER" CURRENT_PROJECT_VERSION="$BUILD" archive 2>&1 | tee -a build.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" build.log
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          sed -i '' 's/^          //' "$RUNNER_TEMP/export.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/GroupRide.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}" 2>&1 | tee -a build.log | grep -E "error:|Upload|EXPORT (SUCCEEDED|FAILED)" || true
          grep -q "EXPORT SUCCEEDED" build.log
          echo "Version $VER ($BUILD) envoyée vers TestFlight : elle apparaît dans App Store Connect après le traitement par Apple (15 à 30 min)." >> "$GITHUB_STEP_SUMMARY"
          rm -f "$KEY"

      - name: Conserver le journal en cas d'échec
        if: failure()
        shell: bash
        run: |
          mkdir -p /tmp/ci
          { echo "Compilation iOS ${{ github.run_number }} – commit ${{ github.sha }}"; grep -E "error:|warning:|FAILED|SUCCEEDED" build.log | tail -n 80; echo ----; tail -n 300 build.log 2>/dev/null || echo "(pas de journal)"; } > /tmp/ci/last-failure.log
          cd /tmp/ci && git init -q && git checkout -q -b ci-logs-ios
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-failure.log && git commit -qm "Journal d'échec iOS, compilation ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs-ios
